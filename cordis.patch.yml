# Installed by the dsh-session-sync bundle.
# `remoteDir` is omitted on purpose: the plugin uses <OneDrive>/dsh-session-sync
# when it can detect OneDrive. Set `remoteDir` here to use another shared folder.
- insert:
    - id: session-sync
      name: '@local/dsh-session-sync'
      config:
        enabled: true
        intervalMs: 60000
        includeSubagents: false
        includeAttachments: true
        # Keep one namespace even when one device is signed in and the other
        # uses an API key. Otherwise the signed-in device syncs user-<id> and
        # never sees the local namespace.
        accountKey: local
        # The Lenovo machine records these directories; both map onto this
        # machine's vsProjects workspace.
        workspaceMap:
          - { remote: 'H:/vsProject', local: 'D:/vsProjects' }
          - { remote: 'H:/vsProject/deepseek-workplase', local: 'D:/vsProjects' }
